<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join event</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F3EEE3;color:#17130F;font-family:'Instrument Sans',sans-serif;font-size:16px;line-height:1.4;overflow:hidden;position:relative">

  <div style="position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:#E8421B;border:2px solid #17130F" aria-hidden="true"></div>
  <div style="position:absolute;right:60px;top:150px;width:90px;height:90px;border-radius:50%;background:#2340F0;border:2px solid #17130F" aria-hidden="true"></div>

  <div style="position:relative;padding:28px 24px 0;display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500">
    <span style="width:9px;height:9px;border-radius:50%;background:#17130F;display:inline-block"></span>Live now
  </div>

  <div style="position:relative;margin-top:150px;padding:0 24px">
    <p style="margin:0 0 8px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6B6256">You're joining</p>
    <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em">Founders &amp; Coffee — Ep. 14</h1>
    <p style="margin:14px 0 0;color:#4A4339;max-width:300px">Chat with the room and everyone watching remotely. No account, no app.</p>
  </div>

  <form style="position:relative;margin-top:auto;padding:0 24px 32px;display:flex;flex-direction:column;gap:12px">
    <label for="name" style="font-weight:600;font-size:14px">Your name <span style="font-weight:400;color:#6B6256">· everyone will see it</span></label>
    <input id="name" placeholder="e.g. Sofia M." autocomplete="given-name" style="min-height:56px;box-sizing:border-box;border:2px solid #17130F;border-radius:14px;background:#FFFDF8;padding:0 16px;font:inherit;font-size:18px;color:#17130F;outline:0">
    <button type="submit" style="min-height:56px;border:2px solid #17130F;border-radius:14px;background:#E8421B;color:#fff;font-weight:600;font-size:18px;box-shadow:0 3px 0 #17130F;display:flex;align-items:center;justify-content:center;gap:10px">
      Join the chat
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <p style="margin:4px 0 0;font-size:12px;color:#6B6256;text-align:center">Messages containing flagged terms wait for the moderator's approval.</p>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
