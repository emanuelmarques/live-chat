<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height:760px;box-sizing:border-box;padding:48px 40px;background:#F3EEE3;color:#17130F;font-family:'Instrument Sans',sans-serif;font-size:15px;line-height:1.4">
  <div style="max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:32px">

    <header>
      <div style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#C2360F;font-weight:500">Event created</div>
      <h1 style="margin:4px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1.05">Founders &amp; Coffee — Ep. 14 is ready</h1>
      <p style="margin:10px 0 0;color:#4A4339;max-width:560px">Show the projector view on the room screen. People scan the code or open the link and start chatting — no account needed.</p>
    </header>

    <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:stretch">

      <section aria-labelledby="qr-h" style="flex:1 1 360px;min-width:0;padding:28px;border:2px solid #17130F;border-radius:20px;background:#FFFDF8;box-shadow:0 4px 0 #17130F;display:flex;flex-direction:column;align-items:center;gap:18px">
        <h2 id="qr-h" style="margin:0;align-self:flex-start;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px">Participant QR code</h2>
        <svg width="260" height="260" viewBox="0 0 21 21" role="img" aria-label="QR code" shape-rendering="crispEdges">
          <rect width="21" height="21" fill="#FFFDF8"/>
          <g fill="#17130F"><path d="M0 0h7v7H0zM14 0h7v7h-7zM0 14h7v7H0z"/></g>
          <g fill="#FFFDF8"><path d="M1 1h5v5H1zM15 1h5v5h-5zM1 15h5v5H1z"/></g>
          <g fill="#17130F"><path d="M2 2h3v3H2zM16 2h3v3h-3zM2 16h3v3H2zM8 0h2v2H8zM11 1h2v3h-2zM8 4h3v2H8zM9 8h2v2H9zM12 8h3v2h-3zM16 9h3v2h-3zM8 11h2v3H8zM11 12h2v2h-2zM14 12h3v3h-3zM18 13h3v2h-3zM9 15h3v2H9zM13 16h2v3h-2zM16 17h2v2h-2zM19 18h2v3h-2zM8 19h3v2H8zM0 8h3v2H0zM4 9h2v2H4zM0 11h2v2H0z"/></g>
        </svg>
        <button style="min-height:44px;padding:0 20px;border:2px solid #17130F;border-radius:12px;background:#FFFDF8;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17130F" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Download PNG</button>
      </section>

      <section aria-labelledby="links-h" style="flex:1.4 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px">
        <h2 id="links-h" style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px">Links</h2>

        <div style="padding:18px;border:2px solid #17130F;border-radius:16px;background:#FFFDF8">
          <div style="font-weight:600">Join link <span style="font-weight:400;color:#6B6256">· for participants</span></div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <input readonly value="livechat.app/j/f9k2" aria-label="Join link" style="flex:1 1 220px;min-width:0;min-height:48px;box-sizing:border-box;border:2px solid #17130F;border-radius:12px;background:#F3EEE3;padding:0 14px;font-family:'DM Mono',monospace;font-size:15px;color:#17130F">
            <button style="min-height:48px;padding:0 20px;border:2px solid #17130F;border-radius:12px;background:#17130F;color:#F3EEE3;font-weight:600;font-size:15px">Copy</button>
          </div>
        </div>

        <div style="padding:18px;border:2px solid #17130F;border-radius:16px;background:#FFFDF8">
          <div style="font-weight:600">Projector link <span style="font-weight:400;color:#6B6256">· for the room screen</span></div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <input readonly value="livechat.app/p/f9k2" aria-label="Projector link" style="flex:1 1 220px;min-width:0;min-height:48px;box-sizing:border-box;border:2px solid #17130F;border-radius:12px;background:#F3EEE3;padding:0 14px;font-family:'DM Mono',monospace;font-size:15px;color:#17130F">
            <button style="min-height:48px;padding:0 20px;border:2px solid #17130F;border-radius:12px;background:#17130F;color:#F3EEE3;font-weight:600;font-size:15px">Copy</button>
          </div>
        </div>

        <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:auto">
          <button style="flex:1 1 220px;min-height:56px;border:2px solid #17130F;border-radius:14px;background:#E8421B;color:#fff;font-weight:600;font-size:17px;box-shadow:0 3px 0 #17130F;display:flex;align-items:center;justify-content:center;gap:10px">Open projector view
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></button>
          <button style="flex:1 1 220px;min-height:56px;border:2px solid #17130F;border-radius:14px;background:transparent;color:#17130F;font-weight:600;font-size:17px">Go to moderation</button>
        </div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
